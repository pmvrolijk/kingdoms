# Tests on every push and pull request; the release workflow calls this first (Design §2.4).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Core tests (JVM and Wasm) and app tests
        run: ./gradlew :core:jvmTest :core:wasmJsNodeTest :composeApp:jvmTest --continue
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "*/build/reports/tests/"
          retention-days: 7
      - name: Snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: composeApp/build/snapshots/
          retention-days: 7
          if-no-files-found: ignore
